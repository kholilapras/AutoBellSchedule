name: Build Windows (PyInstaller only)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]          # Release versi
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_NAME: AutoBellSchedule
      EXE_NAME: AutoBellSchedule.exe
      VERSION: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && replace(github.ref_name, 'v', '') || '0.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -V
          pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pyinstaller==6.10

      - name: Build exe (onefile, no console)
        shell: pwsh
        run: |
          $iconArg = (Test-Path "logo.ico") ? "--icon logo.ico" : ""
          pyinstaller --noconfirm --noconsole --name $env:APP_NAME $iconArg main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/${{ env.APP_NAME }}/${{ env.EXE_NAME }}

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.APP_NAME }} v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: dist/${{ env.APP_NAME }}/${{ env.EXE_NAME }}
